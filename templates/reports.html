<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Отчёты</title>
    <style>
        :root {
            --bg:        #0f1115;
            --bg-elev:   #171a21;
            --border:    #262b36;
            --text:      #e6e9ef;
            --text-dim:  #8b93a7;
            --accent:    #4f8cff;
            --accent-2:  #7aa8ff;
            --success:   #3ecf8e;
            --danger:    #ff6b6b;
            --radius:    14px;
            --shadow:    0 10px 30px rgba(0,0,0,.35);
        }

        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; min-height: 100%; }

        body {
            font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Inter, sans-serif;
            background:
                radial-gradient(1200px 600px at 20% -10%, rgba(79,140,255,.15), transparent 60%),
                radial-gradient(900px 500px at 100% 100%, rgba(62,207,142,.08), transparent 60%),
                var(--bg);
            color: var(--text);
            padding: 40px 20px 60px;
            line-height: 1.5;
        }

        .container { width: min(920px, 100%); margin: 0 auto; }

        /* ─── Шапка ─── */
        .topbar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            animation: rise .5s cubic-bezier(.2,.7,.2,1) both;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 28px;
            animation: rise .5s cubic-bezier(.2,.7,.2,1) both;
        }

        .badge {
            width: 44px; height: 44px;
            border-radius: 12px;
            display: grid; place-items: center;
            background: linear-gradient(135deg, var(--accent), #2f6bd8);
            box-shadow: 0 6px 20px rgba(79,140,255,.35);
            flex-shrink: 0;
        }
        .badge svg { width: 22px; height: 22px; }

        h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -.01em;
        }
        .subtitle {
            margin: 2px 0 0;
            font-size: 13px;
            color: var(--text-dim);
        }

        .counter {
            margin-left: auto;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: rgba(255,255,255,.02);
            font-size: 13px;
            color: var(--text-dim);
        }
        .counter b { color: var(--text); font-variant-numeric: tabular-nums; }

        /* ─── Кнопка экспорта ─── */
        .btn-export {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font: inherit;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(180deg, var(--success), #2fa877);
            border: 1px solid #2a9a6d;
            border-radius: 10px;
            padding: 10px 18px;
            cursor: pointer;
            transition: transform .08s ease, filter .2s ease, box-shadow .2s ease;
            box-shadow: 0 8px 24px rgba(62,207,142,.30), inset 0 1px 0 rgba(255,255,255,.15);
            width: 100%;
            justify-content: center;
        }
        .btn-export:hover:not(:disabled) { filter: brightness(1.08); }
        .btn-export:active:not(:disabled) { transform: translateY(1px); }
        .btn-export:disabled {
            cursor: not-allowed;
            filter: grayscale(.4) brightness(.8);
            box-shadow: none;
        }
        .btn-export svg { width: 18px; height: 18px; }

        .spinner {
            width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,.4);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .7s linear infinite;
            display: none;
        }
        .btn-export.loading .spinner { display: inline-block; }
        .btn-export.loading .icon { display: none; }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ─── Карточки ─── */
        .grid { display: grid; gap: 16px; }

        .card {
            background: linear-gradient(180deg, var(--bg-elev), #12151c);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            animation: rise .5s cubic-bezier(.2,.7,.2,1) both;
        }

        .card-head {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            background: rgba(255,255,255,.02);
        }

        .card-head .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 8px var(--success);
            flex-shrink: 0;
        }

        .name {
            font-weight: 600;
            font-size: 14px;
            color: var(--text);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file {
            margin-left: auto;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 12px;
            color: var(--text-dim);
            padding: 4px 10px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: rgba(255,255,255,.02);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 50%;
        }

        pre {
            margin: 0;
            padding: 16px 18px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 13px;
            line-height: 1.55;
            color: #cfd6e4;
            background: #0b0d12;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 340px;
            overflow: auto;
        }

        pre::-webkit-scrollbar { width: 8px; height: 8px; }
        pre::-webkit-scrollbar-thumb { background: #2a3140; border-radius: 8px; }
        pre::-webkit-scrollbar-thumb:hover { background: #3a4354; }

        .empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-dim);
            border: 1px dashed var(--border);
            border-radius: var(--radius);
            background: rgba(255,255,255,.01);
        }
        .empty svg { width: 40px; height: 40px; opacity: .4; margin-bottom: 12px; }

        /* ─── Тост-уведомление ─── */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 12px 18px;
            border-radius: 12px;
            background: rgba(20,24,32,.95);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 14px;
            box-shadow: var(--shadow);
            transform: translateY(120%);
            transition: transform .3s cubic-bezier(.2,.7,.2,1);
            z-index: 50;
            max-width: 360px;
        }
        .toast.show { transform: translateY(0); }
        .toast.error { border-color: rgba(255,107,107,.6); }
        .toast.success { border-color: rgba(62,207,142,.6); }

        @keyframes rise {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- Кнопка экспорта -->
        <div class="topbar">
            <button id="export-btn" class="btn-export">
                <span class="spinner"></span>
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <path d="M7 10l5 5 5-5"/>
                    <path d="M12 15V3"/>
                </svg>
                <span class="label">Выгрузить в Excel все отчёты</span>
            </button>
        </div>

        <!-- Шапка -->
        <div class="header">
            <div class="badge">
                <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <path d="M14 2v6h6"/>
                </svg>
            </div>
            <div>
                <h1>Отчёты</h1>
                <p class="subtitle">Максимум 3 файла на одно имя</p>
            </div>

            <div class="counter">
                Найдено: <b>{{ reports|length }}</b>
            </div>
        </div>

        {% if reports %}
            <div class="grid">
                {% for r in reports %}
                    <div class="card" style="animation-delay: {{ loop.index0 * 40 }}ms">
                        <div class="card-head">
                            <span class="dot"></span>
                            <span class="name" title="{{ r.name }}">{{ r.name }}</span>
                            <span class="file" title="{{ r.file }}">{{ r.file }}</span>
                        </div>
                        <pre>{{ r.data | tojson(indent=2) }}</pre>
                    </div>
                {% endfor %}
            </div>
        {% else %}
            <div class="empty">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                     stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="7"/>
                    <path d="M21 21l-4.3-4.3"/>
                </svg>
                <div>Отчёты не найдены</div>
            </div>
        {% endif %}

    </div>

    <!-- Тост -->
    <div id="toast" class="toast"></div>

    <script>
        const btn   = document.getElementById('export-btn');
        const toast = document.getElementById('toast');
        const label = btn.querySelector('.label');
        const DEFAULT_LABEL = label.textContent;

        function showToast(msg, type = '') {
            toast.textContent = msg;
            toast.className = 'toast show ' + type;
            clearTimeout(showToast._t);
            showToast._t = setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }

        function setLoading(on) {
            btn.disabled = on;
            btn.classList.toggle('loading', on);
            label.textContent = on ? 'Выгрузка…' : DEFAULT_LABEL;
        }

        // Достаём имя файла из Content-Disposition (поддержка filename* и filename)
        function getFilename(resp, fallback = 'report.xlsx') {
            const cd = resp.headers.get('Content-Disposition') || '';
            // filename*=UTF-8''Отчёт.xlsx
            let m = cd.match(/filename\*\s*=\s*UTF-8''([^;]+)/i);
            if (m) {
                try { return decodeURIComponent(m[1].trim().replace(/^"|"$/g, '')); }
                catch (e) { /* ignore */ }
            }
            // filename="Отчёт.xlsx" или filename=report.xlsx
            m = cd.match(/filename\s*=\s*"?([^";]+)"?/i);
            if (m) return m[1].trim();
            return fallback;
        }

        btn.addEventListener('click', async () => {
            setLoading(true);

            try {
                const resp = await fetch('/export', { method: 'POST' });

                if (!resp.ok) {
                    // Сервер мог вернуть JSON с деталями ошибки
                    const ct = (resp.headers.get('Content-Type') || '').toLowerCase();
                    let detail = `HTTP ${resp.status}`;
                    if (ct.includes('application/json')) {
                        const data = await resp.json().catch(() => ({}));
                        if (data && data.message) detail = data.message;
                    } else {
                        const text = await resp.text().catch(() => '');
                        if (text) detail += ': ' + text.slice(0, 200);
                    }
                    throw new Error(detail);
                }

                // Получаем файл как Blob и инициируем скачивание
                const blob = await resp.blob();
                if (!blob || blob.size === 0) {
                    throw new Error('Пустой файл');
                }

                const filename = getFilename(resp, 'report.xlsx');

                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.rel = 'noopener';
                document.body.appendChild(a);
                a.click();
                a.remove();
                // Отзываем URL чуть позже, чтобы Safari успел начать загрузку
                setTimeout(() => URL.revokeObjectURL(url), 1500);

                showToast('Файл сохранён: ' + filename, 'success');

            } catch (e) {
                showToast('Ошибка: ' + e.message, 'error');
            } finally {
                setLoading(false);
            }
        });
    </script>
</body>
</html>
